[project]
name = "jobs-tui"
version = "0.1.0"
description = "Terminal app for tailoring a resume per job application"
requires-python = ">=3.12"
dependencies = [
  "textual>=8.2,<9",
  "pyyaml>=6.0",
  "curl_cffi>=0.16",
  "trafilatura>=2.2",
  "lxml>=6.0",
  "cssselect>=1.5",
  "markdownify>=1.2",
  "patchright>=1.63",
  "watchfiles>=1.3",
]

[project.scripts]
jobs-tui = "jobs_tui.cli:main"

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobs_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
